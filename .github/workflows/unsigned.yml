
name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      build_rust:
        description: 'Build Rust Core'
        required: true
        type: boolean
        default: true
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.1.0'

      - name: Set up Rust
        if: ${{ inputs.build_rust == true || github.event_name != 'workflow_dispatch' }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim

      - name: Build Rust Core
        if: ${{ inputs.build_rust == true || github.event_name != 'workflow_dispatch' }}
        run: |
          export DEVELOPER_DIR="/Applications/Xcode_16.1.app/Contents/Developer"

          # 1. Install cargo-swift / cbindgen if needed by build script
          cargo install cargo-swift || true

          # 2. Execute build script if present
          if [ -f "build-rust.sh" ]; then
            chmod +x build-rust.sh
            ./build-rust.sh
          elif [ -f "rust-core/build.sh" ]; then
            cd rust-core && chmod +x build.sh && ./build.sh && cd ..
          fi

          # 3. Search and relocate SideInstallerFFI.xcframework to root
          FOUND_FRAMEWORK=$(find . -name "SideInstallerFFI.xcframework" -type d | head -n 1)

          if [ -n "$FOUND_FRAMEWORK" ]; then
            echo "Found framework at: $FOUND_FRAMEWORK"
            if [ "$FOUND_FRAMEWORK" != "./SideInstallerFFI.xcframework" ]; then
              echo "Copying $FOUND_FRAMEWORK to project root..."
              cp -R "$FOUND_FRAMEWORK" ./SideInstallerFFI.xcframework
            fi
          else
            echo "::error::SideInstallerFFI.xcframework was NOT generated by the build step!"
            echo "Listing repository content for debugging:"
            ls -la
            find . -maxdepth 3 -not -path '*/.*'
            exit 1
          fi

      - name: Resolve Xcode Dependencies
        run: |
          if [ -f "project.yml" ]; then
            brew install xcodegen
            xcodegen generate
          fi

      - name: Build App & Generate Payload
        run: |
          export DEVELOPER_DIR="/Applications/Xcode_16.1.app/Contents/Developer"
          
          # 1. Compile target using xcodebuild
          xcodebuild build \
            -scheme "SideInstaller" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            IPHONEOS_DEPLOYMENT_TARGET=18.0

          # 2. Locate built .app bundle
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "Error: Could not find built .app bundle!"
            exit 1
          fi

          echo "Found built app at: $APP_PATH"

          # 3. Package into standard IPA format
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r SideInstaller-iOS18.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SideInstaller-iOS18-IPA
          path: SideInstaller-iOS18.ipa
          retire-days: 7
