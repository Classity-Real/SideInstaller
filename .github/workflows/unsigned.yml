name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      build_rust:
        description: 'Build Rust Core'
        required: true
        type: boolean
        default: true
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Select Xcode 15.4 and set up system environment paths
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      # Install both physical device and simulator targets for Rust
      - name: Set up Rust
        if: ${{ inputs.build_rust == true || github.event_name != 'workflow_dispatch' }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim

      # Build Rust core dependencies if enabled and build-rust.sh exists
      - name: Build Rust Core
        if: ${{ inputs.build_rust == true || github.event_name != 'workflow_dispatch' }}
        run: |
          export DEVELOPER_DIR="/Applications/Xcode_15.4.app/Contents/Developer"
          if [ -f "build-rust.sh" ]; then
            chmod +x build-rust.sh
            ./build-rust.sh
          else
            echo "No build-rust.sh found, skipping script execution."
          fi

      # Generate Xcode project if using XcodeGen
      - name: Resolve Xcode Dependencies
        run: |
          if [ -f "project.yml" ]; then
            brew install xcodegen
            xcodegen generate
          fi

      # Compile the app target and package it into an IPA
      - name: Build App & Generate Payload
        run: |
          export DEVELOPER_DIR="/Applications/Xcode_15.4.app/Contents/Developer"
          
          # 1. Compile the app target using xcodebuild (Ad-Hoc / Unsigned for Sideloading)
          xcodebuild build \
            -scheme "SideInstaller" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            IPHONEOS_DEPLOYMENT_TARGET=18.0

          # 2. Locate built .app bundle
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "Error: Could not find built .app bundle!"
            exit 1
          fi

          echo "Found built app at: $APP_PATH"

          # 3. Package into standard IPA structure (Payload/YourApp.app)
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r SideInstaller-iOS18.ipa Payload

      # Upload the final compiled .ipa file to GitHub Actions Artifacts
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SideInstaller-iOS18-IPA
          path: SideInstaller-iOS18.ipa
          retire-days: 7
