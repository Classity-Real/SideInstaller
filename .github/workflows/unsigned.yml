name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      # FIX: Installed both physical device and simulator targets for Rust
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim

      - name: Build Rust Core (Optional)
        run: |
          export DEVELOPER_DIR="/Applications/Xcode_15.4.app/Contents/Developer"
          if [ -f "build-rust.sh" ]; then
            chmod +x build-rust.sh
            ./build-rust.sh
          fi

      - name: Resolve Xcode Dependencies
        run: |
          if [ -f "project.yml" ]; then
            pip3 install xcodegen
            xcodegen generate
          fi

      - name: Build App & Generate Payload
        run: |
          export DEVELOPER_DIR="/Applications/Xcode_15.4.app/Contents/Developer"
          
          # 1. Compile the app target using xcodebuild
          xcodebuild build \
            -scheme "SideInstaller" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            IPHONEOS_DEPLOYMENT_TARGET=18.0

          # 2. Locate built .app bundle
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "Error: Could not find built .app bundle!"
            exit 1
          fi

          echo "Found built app at: $APP_PATH"

          # 3. Package into standard IPA format
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r SideInstaller-iOS18.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SideInstaller-iOS18-IPA
          path: SideInstaller-iOS18.ipa
          retire-days: 7
